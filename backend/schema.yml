components:
  schemas:
    AcademicResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: integer
        subject_name:
          type: string
          readOnly: true
        grade:
          $ref: '#/components/schemas/GradeEnum'
        points:
          type: integer
          readOnly: true
      required:
      - grade
      - id
      - points
      - subject
      - subject_name
    AcademicResultRequest:
      type: object
      properties:
        subject:
          type: integer
        grade:
          $ref: '#/components/schemas/GradeEnum'
      required:
      - grade
      - subject
    AttributeTypeEnum:
      enum:
      - SKILL
      - INTEREST
      - HOBBY
      - STYLE
      - VALUE
      type: string
      description: |-
        * `SKILL` - Skill
        * `INTEREST` - Interest
        * `HOBBY` - Hobby
        * `STYLE` - Learning Style
        * `VALUE` - Core Value
    BlankEnum:
      enum:
      - ''
    CareerGoal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
      required:
      - id
      - title
    CareerGoalRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
      required:
      - title
    CategoryEnum:
      enum:
      - GP1
      - GP2
      - GP3
      - GP4
      - GP5
      type: string
      description: |-
        * `GP1` - Group 1 (Compulsory)
        * `GP2` - Group 2 (Sciences)
        * `GP3` - Group 3 (Humanities)
        * `GP4` - Group 4 (Technicals)
        * `GP5` - Group 5 (Foreign Languages/Business)
    ClusterGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        level:
          type: integer
        level_name:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
      required:
      - id
      - level
      - level_name
      - name
    CutOffPoint:
      type: object
      properties:
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cutoff_type:
          allOf:
          - $ref: '#/components/schemas/CutoffTypeEnum'
          description: |-
            Whether this uses weighted points or mean grade

            * `WEIGHTED_POINTS` - Weighted Cluster Points
            * `MEAN_GRADE` - Mean Grade
        weighted_cluster_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
          description: Cut-off for degree programmes (e.g., 42.155)
        mean_grade_cutoff:
          type: string
          nullable: true
          description: Cut-off for TVET programmes (e.g., C-, C+)
          maxLength: 2
        capacity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Declared slots for this offering
        placed_students:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Number of students placed
      required:
      - year
    CutoffTypeEnum:
      enum:
      - WEIGHTED_POINTS
      - MEAN_GRADE
      type: string
      description: |-
        * `WEIGHTED_POINTS` - Weighted Cluster Points
        * `MEAN_GRADE` - Mean Grade
    GradeEnum:
      enum:
      - A
      - A-
      - B+
      - B
      - B-
      - C+
      - C
      - C-
      - D+
      - D
      - D-
      - E
      type: string
      description: |-
        * `A` - A
        * `A-` - A-
        * `B+` - B+
        * `B` - B
        * `B-` - B-
        * `C+` - C+
        * `C` - C
        * `C-` - C-
        * `D+` - D+
        * `D` - D
        * `D-` - D-
        * `E` - E
    Institution:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          description: KUCCPS Institution Code
          maxLength: 50
        institution_type:
          $ref: '#/components/schemas/InstitutionTypeEnum'
        location:
          type: string
          description: City or Town
          maxLength: 100
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
      required:
      - code
      - id
      - location
      - name
    InstitutionTypeEnum:
      enum:
      - PUBLIC_UNIVERSITY
      - PRIVATE_UNIVERSITY
      - TVET
      type: string
      description: |-
        * `PUBLIC_UNIVERSITY` - Public University
        * `PRIVATE_UNIVERSITY` - Private University
        * `TVET` - TVET/College
    JobMarketDemandEnum:
      enum:
      - HIGH
      - MODERATE
      - LOW
      type: string
      description: |-
        * `HIGH` - High
        * `MODERATE` - Moderate
        * `LOW` - Low
    MinimumGradeEnum:
      enum:
      - A
      - A-
      - B+
      - B
      - B-
      - C+
      - C
      - C-
      - D+
      - D
      - D-
      type: string
      description: |-
        * `A` - A
        * `A-` - A-
        * `B+` - B+
        * `B` - B
        * `B-` - B-
        * `C+` - C+
        * `C` - C
        * `C-` - C-
        * `D+` - D+
        * `D` - D
        * `D-` - D-
    NullEnum:
      enum:
      - null
    PatchedAcademicResultRequest:
      type: object
      properties:
        subject:
          type: integer
        grade:
          $ref: '#/components/schemas/GradeEnum'
    PatchedPromptSubmissionRequest:
      type: object
      properties:
        payload:
          description: The full multi-step wizard data.
    PatchedStudentProfileRequest:
      type: object
      properties:
        kcse_index_number:
          type: string
          nullable: true
          maxLength: 20
        kcse_year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Year the student sat for KCSE
        mean_grade:
          type: string
          nullable: true
          maxLength: 2
    Programme:
      type: object
      description: Generic programme with all requirements + all offerings
      properties:
        id:
          type: integer
          readOnly: true
        kuccps_code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        level:
          type: integer
        level_name:
          type: string
          readOnly: true
        cluster:
          type: integer
          nullable: true
        cluster_info:
          allOf:
          - $ref: '#/components/schemas/ClusterGroup'
          readOnly: true
        description:
          type: string
        job_market_demand:
          $ref: '#/components/schemas/JobMarketDemandEnum'
        minimum_mean_grade:
          type: string
          nullable: true
          description: Minimum mean grade for TVET programmes (e.g., C-, D+, C)
          maxLength: 3
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/ProgrammeRequirement'
          readOnly: true
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/ProgrammeOffering'
          readOnly: true
      required:
      - cluster_info
      - id
      - kuccps_code
      - level
      - level_name
      - name
      - offerings
      - requirements
    ProgrammeOffering:
      type: object
      description: Shows a generic programme offered at a specific institution
      properties:
        id:
          type: integer
          readOnly: true
        institution:
          type: integer
        institution_name:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        cutoffs:
          type: array
          items:
            $ref: '#/components/schemas/CutOffPoint'
          readOnly: true
      required:
      - cutoffs
      - id
      - institution
      - institution_name
      - location
    ProgrammeRequirement:
      type: object
      properties:
        subject:
          type: integer
          nullable: true
          description: Specific subject required (e.g. Math)
        subject_name:
          type: string
          readOnly: true
        subject_category:
          nullable: true
          description: |-
            If no specific subject, require a category (e.g. Any Group 2)

            * `GP1` - Group 1 (Compulsory)
            * `GP2` - Group 2 (Sciences)
            * `GP3` - Group 3 (Humanities)
            * `GP4` - Group 4 (Technicals)
            * `GP5` - Group 5 (Foreign Languages/Business)
          oneOf:
          - $ref: '#/components/schemas/CategoryEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        minimum_grade:
          $ref: '#/components/schemas/MinimumGradeEnum'
        is_category:
          type: boolean
          description: True if requiring 'Any Group 2' or alternatives like 'ENG or
            KIS'
        description:
          type: string
          description: Full requirement text for complex rules (e.g., 'ENG(101)/KIS(102):C+'
            or 'Any two Group II subjects')
      required:
      - subject_name
    PromptSubmission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        payload:
          description: The full multi-step wizard data.
        result:
          readOnly: true
          description: The generated AI recommendation JSON.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - payload
      - result
      - user
    PromptSubmissionRequest:
      type: object
      properties:
        payload:
          description: The full multi-step wizard data.
      required:
      - payload
    StudentAttribute:

        kcse_year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Year the student sat for KCSE
        mean_grade:
          type: string
          nullable: true
          maxLength: 2
        academic_results:
          type: array
          items:
            $ref: '#/components/schemas/AcademicResult'
          readOnly: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/StudentAttribute'
          readOnly: true
        career_goals:

openapi: 3.0.3
info:
  title: AIACADEMIA – PROACTED API Docs
  version: 1.0.0
  description: Detailed API documentation for the AI Course Recommender system. All
    protected endpoints require a Supabase JWT Bearer Token.
paths:
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Returns basic profile information for the currently logged-in user
        (authenticated via Supabase JWT).
      summary: Get authenticated user profile
      tags:
      - auth
      security:
      - bearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                  is_student:
                    type: boolean
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''

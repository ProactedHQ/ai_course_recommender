# KeDira CI - validates pull requests to main and pushes to main.
#
# Safety: no secrets are used or needed. The backend always runs with APP_ENV=test
# (in-memory SQLite, mock payments, no Redis; production database/Supabase/PayHero are refused by
# settings.py). Nothing here deploys, uses SSH/FTP, or contacts HostPinnacle, PayHero or Supabase.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Django, APP_ENV=test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify isolated test configuration
        run: python ci/check_test_environment.py

      - name: Payment, configuration, environment-safety and user tests (must all pass)
        run: >-
          python manage.py test --noinput -v 2
          apps.subscriptions.tests.test_payments
          apps.subscriptions.tests.test_config
          apps.utils.tests.test_env_safety
          apps.users.tests.test_auth
          apps.users.tests.test_prompts
          apps.users.tests.test_admin

      - name: Full backend suite (fails on any failure not in ci/known_test_failures.txt)
        run: python ci/run_backend_suite.py

  frontend:
    name: Frontend lint & build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint (fails on new violations; pre-existing ones are listed in eslint-suppressions.json)
        run: npx eslint . --pass-on-unpruned-suppressions

      - name: Production build
        # Uses only the committed public build values (frontend/.env.production: public Supabase
        # anon key + API URL). No secrets are injected.
        run: npm run build
